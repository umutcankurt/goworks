version: 2
updates:
  # npm dependencies — weekly.
  #
  # Grouping here is not about PR noise, it is about correctness. Dependabot
  # bumps each package independently unless told otherwise, and for packages
  # that peer-depend on each other that produces PRs which are broken the
  # moment they are opened. Both of these actually happened:
  #
  #   - react-dom was moved to 19 while react stayed at 18, so the lockfile
  #     carried react@18.3.1 next to react-dom@19.2.7 whose peer range is
  #     ^19.2.7 (PR #4).
  #   - react-i18next was moved to 17, which requires i18next >= 26.2.0, while
  #     i18next stayed pinned at ^23.16.8 (PR #5).
  #
  # A dependency lands in the FIRST group whose patterns match, so the
  # peer-coupled groups are listed before the catch-all dev-dependencies group.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # react and react-dom share internals and must move together; the types
      # and testing-library ride along or the tests stop type-checking.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@testing-library/react"

      # react-i18next declares a hard peer range on i18next.
      i18n:
        patterns:
          - "i18next"
          - "i18next-*"
          - "react-i18next"

      # The Vite/Electron build chain: a Vite major that leaves
      # vite-plugin-electron behind cannot build the app (PR #8).
      build-toolchain:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-electron"
          - "vite-plugin-electron-renderer"
          - "electron"
          - "electron-builder"

      # eslint-plugin-react-refresh 0.5+ requires eslint ^9 || ^10, so the
      # plugin cannot advance until eslint does. Grouping them states that
      # coupling: the family moves as one migration instead of a single plugin
      # arriving alone and failing `npm ci` with ERESOLVE (PR #17).
      #
      # update-types is deliberately unset — majors are the entire point here.
      # The resulting PR will install cleanly but fail `npm run lint`, because
      # eslint 9 dropped the legacy .eslintrc.cjs this repo still uses. That is
      # expected: the PR is the flat-config migration ticket, and it fails at
      # one clear step instead of an opaque dependency-resolution error.
      eslint:
        patterns:
          - "eslint"
          - "eslint-config-*"
          - "eslint-plugin-*"
          - "@typescript-eslint/*"

      # Everything else in devDependencies, minor and patch only. Majors are
      # deliberately excluded so they arrive as individual, reviewable PRs
      # instead of an 18-package pile-up that breaks lint, build and tests at
      # once with no way to tell which package did it (PR #10).
      #
      # NOTE: update-types does not protect against 0.x packages. Semver calls
      # 0.4 -> 0.5 a "minor", but by convention that range is where breaking
      # changes live. That is exactly how eslint-plugin-react-refresh reached
      # #17 and broke it; it now belongs to the eslint group above.
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Keep GitHub Actions (CI) pinned versions fresh
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
