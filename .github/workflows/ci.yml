name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 24 ships npm 11. That matters: package-lock.json is generated by
      # npm 11, which honours `peerDependenciesMeta.<dep>.optional` and therefore
      # omits vite@8's optional `esbuild` peer. npm 10 (Node 22) ignores the flag,
      # demands esbuild@0.28.1 + its 28 platform packages, and fails `npm ci` with
      # EUSAGE on every branch — which is why CI had never once been green.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci runs postinstall → electron-rebuild builds better-sqlite3 for the
      # Electron ABI. test:prepare additionally builds/caches the Node ABI binary
      # that vitest needs (see scripts/sqlite-binary.mjs, the pretest/posttest swap).
      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint, max-warnings 0)
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Prepare native test binary (better-sqlite3 Node ABI)
        run: npm run test:prepare

      # `npm test`, not `npx vitest run` — the pretest/posttest hooks are what
      # swap better-sqlite3 to the Node ABI and back. `--run` is explicit because
      # vitest v4 dropped the implicit `run` and otherwise relies on CI detection
      # alone to stay out of watch mode.
      - name: Test (Vitest)
        run: npm test -- --run

      # Bundle compile only — the full electron-builder installer packaging and
      # code-signing happen locally during release, not in CI.
      - name: Build (vite bundle)
        run: npx vite build

      # The control that stands between this project and a repeat of the
      # v0.7.2-v0.7.7 shipped-credential incident. Local discipline is not
      # enough for that; it belongs in CI.
      - name: Bundle secret scan
        run: npm run secrets:check
